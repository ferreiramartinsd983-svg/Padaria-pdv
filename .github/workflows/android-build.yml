name: Build Android APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: set -o pipefail; bun install --frozen-lockfile 2>&1 | tee web-build.log

      - name: Build web interface
        run: set -o pipefail; bun run build 2>&1 | tee -a web-build.log

      - name: Package web interface in Android app
        run: |
          mkdir -p app/src/main/assets/www
          cp -R dist/. app/src/main/assets/www/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: set -o pipefail; gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report build failure details
        if: failure()
        run: |
          detail=$(for file in web-build.log build.log; do [ ! -f "$file" ] || cat "$file"; done | tail -n 80 | tr '\n' ' ' | cut -c1-6000)
          echo "::error title=Build output::$detail"

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: padaria-master-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            web-build.log
            build.log
          if-no-files-found: warn

      - name: Publish APK download
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Padaria Master APK build ${{ github.run_number }}
          body: APK de depuração compilado pelo GitHub Actions.
          files: app/build/outputs/apk/debug/app-debug.apk
          token: ${{ github.token }}

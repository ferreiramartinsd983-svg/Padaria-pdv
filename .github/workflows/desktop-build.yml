name: Build Windows desktop installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: |
          git remote remove origin
          $env:GITHUB_REPOSITORY = ""
          $env:GITHUB_ACTIONS = ""
          npm run desktop:dist -- --win nsis --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Padaria-Master-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish download release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Padaria Master para Windows (build ${{ github.run_number }})
          body: Instalador Windows gerado pelo GitHub Actions.
          files: release/*.exe
